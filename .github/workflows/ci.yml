name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, "feature/**", "feat/**"]
  workflow_dispatch:

# A new push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Auth service: lint, type check, tests (unit + integration) and build
  # ---------------------------------------------------------------------------
  auth-service:
    name: Auth service (Express + TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-service
    services:
      postgres:
        image: postgres:16-alpine
        # Throwaway database that only lives during this job.
        env:
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: ci_auth_password
          POSTGRES_DB: auth_db_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auth_user -d auth_db_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: auth_db_test
      DB_USER: auth_user
      DB_PASSWORD: ci_auth_password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/auth-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Keys are never committed: CI generates a fresh pair for each run.
      - name: Generate JWT key pair
        run: npm run keys:generate

      - name: Tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results.xml

      - name: Build
        run: npm run build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-test-results
          path: services/auth-service/test-results.xml

  # ---------------------------------------------------------------------------
  # 2. Repairs service: lint, format check, migrations check and tests
  # ---------------------------------------------------------------------------
  repairs-service:
    name: Repairs service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/repairs-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: repairs_user
          POSTGRES_PASSWORD: ci_repairs_password
          POSTGRES_DB: repairs_db_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U repairs_user -d repairs_db_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REPAIRS_TEST_DATABASE_URL: postgresql+psycopg://repairs_user:ci_repairs_password@localhost:5432/repairs_db_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/repairs-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # Tests generate their own RSA key pair and rebuild the schema with Alembic.
      - name: Tests
        run: pytest --cov=app --cov-report=term --cov-report=xml --junitxml=test-results.xml

      - name: Models match migrations
        env:
          REPAIRS_DATABASE_URL: ${{ env.REPAIRS_TEST_DATABASE_URL }}
        run: alembic check

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repairs-service-test-results
          path: |
            services/repairs-service/test-results.xml
            services/repairs-service/coverage.xml

  # ---------------------------------------------------------------------------
  # 3. Test environment: build the images, start the whole stack with
  #    docker compose and run an end-to-end smoke test.
  # ---------------------------------------------------------------------------
  e2e:
    name: Docker compose + end-to-end smoke test
    runs-on: ubuntu-latest
    needs: [auth-service, repairs-service]
    # Shell variables take precedence over .env in docker compose.
    env:
      SEED_ADMIN_ENABLED: "true"
      SEED_ADMIN_EMAIL: ci-admin@mining-repairs.local
      SEED_ADMIN_PASSWORD: CiAdmin12345
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p keys
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out keys/jwt-private.pem
          openssl rsa -in keys/jwt-private.pem -pubout -out keys/jwt-public.pem
          chmod 644 keys/*.pem  # readable by the non-root users inside the containers

      - name: Start stack
        run: docker compose up -d --build --wait postgres auth-service repairs-service

      - name: Smoke test
        env:
          ADMIN_EMAIL: ${{ env.SEED_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ env.SEED_ADMIN_PASSWORD }}
        run: bash scripts/smoke-test.sh

      - name: Service logs
        if: always()
        run: docker compose logs auth-service repairs-service

      - name: Stop stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # 4. Publish images to GitHub Container Registry (only on main)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth-service, repairs-service]
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mer-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
