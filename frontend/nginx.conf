server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Note: caching uses "expires" instead of add_header, because an add_header
    # inside a location would drop the security headers above.

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Single page app: unknown paths fall back to index.html (client-side routing).
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
