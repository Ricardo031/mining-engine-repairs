[project]
name = "repairs-service"
version = "1.0.0"
description = "Business API for heavy mining engine repairs (FastAPI)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["B008"]  # FastAPI uses calls in defaults (Depends/Query)

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
