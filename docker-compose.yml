name: mining-engine-repairs

services:
  postgres:
    image: postgres:16-alpine
    container_name: mer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      REPAIRS_DB_NAME: ${REPAIRS_DB_NAME}
      REPAIRS_DB_USER: ${REPAIRS_DB_USER}
      REPAIRS_DB_PASSWORD: ${REPAIRS_DB_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: mer-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: mer-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: info
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${AUTH_DB_NAME}
      DB_USER: ${AUTH_DB_USER}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      DB_SSL: "false"
      DB_LOGGING: "false"
      DB_MIGRATIONS_RUN: "true"
      JWT_PRIVATE_KEY_PATH: /app/keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt-public.pem
      JWT_ISSUER: ${JWT_ISSUER:-mining-repairs-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-mining-repairs-api}
      JWT_EXPIRES_IN_SECONDS: 3600
      BCRYPT_ROUNDS: 12
      # Bootstrap admin (idempotent). Disabled unless enabled in .env.
      SEED_ADMIN_ENABLED: ${SEED_ADMIN_ENABLED:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - "${AUTH_SERVICE_HOST_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy

  repairs-service:
    build:
      context: ./services/repairs-service
      dockerfile: Dockerfile
    container_name: mer-repairs-service
    restart: unless-stopped
    environment:
      REPAIRS_ENVIRONMENT: production
      REPAIRS_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      REPAIRS_DATABASE_URL: postgresql+psycopg://${REPAIRS_DB_USER}:${REPAIRS_DB_PASSWORD}@postgres:5432/${REPAIRS_DB_NAME}
      REPAIRS_JWT_PUBLIC_KEY_PATH: /app/keys/jwt-public.pem
      REPAIRS_JWT_ISSUER: ${JWT_ISSUER:-mining-repairs-auth}
      REPAIRS_JWT_AUDIENCE: ${JWT_AUDIENCE:-mining-repairs-api}
    ports:
      - "${REPAIRS_SERVICE_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      # Only the PUBLIC key: this service can verify tokens but never sign them.
      - ./keys/jwt-public.pem:/app/keys/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
